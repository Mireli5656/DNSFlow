name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tag
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare the release files
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DNSFlow-${TAG}.apk"
          cd dist
          sha256sum "DNSFlow-${TAG}.apk" > "DNSFlow-${TAG}.apk.sha256"

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
